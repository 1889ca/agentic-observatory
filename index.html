<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentic Workflow Observatory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <h1><span>Observatory</span> &mdash; Agentic Workflow Patterns</h1>
      <p>Riley's pattern library for multi-agent orchestration.</p>
    </div>
  </header>

  <div class="search-bar">
    <label for="search" class="sr-only">Search patterns</label>
    <input type="text" id="search" placeholder="Search patterns..." autocomplete="off" role="searchbox" aria-label="Search patterns">
  </div>

  <div class="pattern-list" id="pattern-list"></div>

  <footer class="site-footer">
    Agentic Workflow Observatory &middot; Maintained by Riley
  </footer>

  <script src="patterns.js"></script>
  <script>
    const list = document.getElementById("pattern-list");
    const searchInput = document.getElementById("search");

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function renderPatterns() {
      list.innerHTML = "";
      PATTERNS.forEach((p) => {
        const card = document.createElement("a");
        card.className = "pattern-card";
        card.href = `pattern.html?p=${encodeURIComponent(p.slug)}`;
        card.dataset.search = `${p.title} ${p.summary}`.toLowerCase();
        card.innerHTML = `
          <h2>${escapeHtml(p.title)}</h2>
          <p>${escapeHtml(p.summary)}</p>
          <span class="status ${escapeHtml(p.status)}">${escapeHtml(p.status)}</span>
        `;
        list.appendChild(card);
      });
    }

    searchInput.addEventListener("input", () => {
      const q = searchInput.value.toLowerCase().trim();
      list.querySelectorAll(".pattern-card").forEach((card) => {
        card.classList.toggle("hidden", q && !card.dataset.search.includes(q));
      });
    });

    renderPatterns();
  </script>
</body>
</html>
