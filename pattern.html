<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pattern — Observatory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <h1><a href="index.html" style="color: inherit; text-decoration: none;"><span>Observatory</span></a></h1>
    </div>
  </header>

  <div class="pattern-content" id="content">
    <a href="index.html" class="back">&larr; All patterns</a>
    <div class="loading">Loading pattern...</div>
  </div>

  <footer class="site-footer">
    Agentic Workflow Observatory &middot; Maintained by Riley
  </footer>

  <script src="patterns.js"></script>
  <script>
    const content = document.getElementById("content");
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("p");

    // Validate slug contains only safe characters
    const safeSlug = slug && /^[a-z0-9-]+$/.test(slug) ? slug : null;
    const meta = safeSlug ? PATTERNS.find((p) => p.slug === safeSlug) : null;

    if (!safeSlug || !meta) {
      const safe = document.createElement("span");
      safe.textContent = slug || "(none)";
      content.innerHTML = `
        <a href="index.html" class="back">&larr; All patterns</a>
        <h1>Pattern not found</h1>
        <p>No pattern matching "${escapeHtml(safe.textContent)}". <a href="index.html">Back to all patterns</a>.</p>
      `;
    } else {
      document.title = `${meta.title} — Observatory`;
      fetch(`patterns/${safeSlug}.md`)
        .then((r) => {
          if (!r.ok) throw new Error("Not found");
          return r.text();
        })
        .then((md) => {
          content.innerHTML = `
            <a href="index.html" class="back">&larr; All patterns</a>
            ${renderMarkdown(md)}
          `;
        })
        .catch(() => {
          content.innerHTML = `
            <a href="index.html" class="back">&larr; All patterns</a>
            <h1>${escapeHtml(meta.title)}</h1>
            <p class="summary">${escapeHtml(meta.summary)}</p>
            <p>Pattern content not yet available.</p>
          `;
        });
    }

    /**
     * Minimal markdown renderer — no dependencies.
     * Handles: h1, h2, h3, blockquote, ul, code blocks, inline code, links, paragraphs.
     */
    function renderMarkdown(md) {
      const lines = md.split("\n");
      let html = "";
      let inCode = false;
      let buf = "";
      // Stack of open list tags: [{tag: "ul"|"ol", indent: number}]
      let listStack = [];

      function closeListsTo(indent) {
        while (listStack.length && listStack[listStack.length - 1].indent >= indent) {
          html += `</${listStack.pop().tag}>`;
        }
      }

      function closeAllLists() {
        while (listStack.length) {
          html += `</${listStack.pop().tag}>`;
        }
      }

      function parseListItem(line) {
        const ulMatch = line.match(/^(\s*)- (.*)$/);
        if (ulMatch) return { indent: ulMatch[1].length, tag: "ul", text: ulMatch[2] };
        const olMatch = line.match(/^(\s*)\d+\. (.*)$/);
        if (olMatch) return { indent: olMatch[1].length, tag: "ol", text: olMatch[2] };
        return null;
      }

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];

        // Fenced code blocks
        if (line.startsWith("```")) {
          if (inCode) {
            html += escapeHtml(buf) + "</code></pre>";
            buf = "";
            inCode = false;
          } else {
            closeAllLists();
            inCode = true;
            html += "<pre><code>";
          }
          continue;
        }
        if (inCode) {
          buf += (buf ? "\n" : "") + line;
          continue;
        }

        const listItem = parseListItem(line);

        // Close lists if non-list line
        if (!listItem && listStack.length) {
          closeAllLists();
        }

        // Headings
        if (line.startsWith("# ")) {
          html += `<h1>${inline(line.slice(2))}</h1>`;
        } else if (line.startsWith("## ")) {
          html += `<h2>${inline(line.slice(3))}</h2>`;
        } else if (line.startsWith("### ")) {
          html += `<h3>${inline(line.slice(4))}</h3>`;
        }
        // Blockquote
        else if (line.startsWith("> ")) {
          html += `<p class="summary">${inline(line.slice(2))}</p>`;
        }
        // List item (unordered or ordered, with nesting)
        else if (listItem) {
          const { indent, tag, text } = listItem;
          if (!listStack.length) {
            html += `<${tag}>`;
            listStack.push({ tag, indent });
          } else {
            const top = listStack[listStack.length - 1];
            if (indent > top.indent) {
              html += `<${tag}>`;
              listStack.push({ tag, indent });
            } else if (indent < top.indent) {
              closeListsTo(indent + 1);
              // If tag type changed at same level, close and reopen
              if (listStack.length && listStack[listStack.length - 1].tag !== tag) {
                html += `</${listStack.pop().tag}><${tag}>`;
                listStack.push({ tag, indent });
              }
            } else if (top.tag !== tag) {
              html += `</${listStack.pop().tag}><${tag}>`;
              listStack.push({ tag, indent });
            }
          }
          html += `<li>${inline(text)}</li>`;
        }
        // HTML comment (skip)
        else if (line.trim().startsWith("<!--")) {
          continue;
        }
        // Blank line
        else if (line.trim() === "") {
          continue;
        }
        // Paragraph
        else {
          html += `<p>${inline(line)}</p>`;
        }
      }

      closeAllLists();
      return html;
    }

    function inline(text) {
      // Escape HTML first, then apply markdown formatting
      text = escapeHtml(text);
      return text
        // inline code
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        // bold
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        // italic
        .replace(/\*([^*]+)\*/g, "<em>$1</em>")
        // links — rewrite .md hrefs to pattern.html?p=slug
        .replace(/\[([^\]]+)\]\(\.\/([^)]+)\.md\)/g, (_, label, file) => {
          return `<a href="pattern.html?p=${encodeURIComponent(file)}">${label}</a>`;
        })
        // external links (only allow http/https)
        .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" rel="noopener noreferrer" target="_blank">$1</a>');
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
